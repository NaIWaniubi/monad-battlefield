<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05060a" />
    <meta name="color-scheme" content="dark" />
    <title>到场验证 · MONAD BATTLEFIELD</title>
    <style>
      /* 与主屏/观众页同一套语言：深底、发丝线、等宽小字、单一强调色 */
      :root {
        --void: #05060a;
        --void-2: #0a0c14;
        --ink: #eef1f7;
        --ink-2: #a8b0c2;
        --ink-3: #6e778d;
        --hair: rgba(255, 255, 255, 0.08);
        --accent: #ffb020;
        --f-sans: "Inter", -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; min-height: 100%; background: var(--void); color: var(--ink); font-family: var(--f-sans); -webkit-font-smoothing: antialiased; }
      body { background-image: radial-gradient(120% 50% at 50% -8%, rgba(90, 120, 190, 0.10), transparent 60%); }
      #wrap { max-width: 680px; margin: 0 auto; padding: 16px 14px calc(28px + env(safe-area-inset-bottom)); }

      header.top { display: flex; align-items: center; gap: 10px; padding: 6px 2px 14px; border-bottom: 1px solid var(--hair); }
      .brand { font-family: var(--f-mono); font-size: 13px; letter-spacing: 0.18em; color: var(--ink-2); }
      .lamp { width: 10px; height: 10px; border-radius: 50%; background: #444; flex: none; }
      .lamp.ok { background: #3ddc84; box-shadow: 0 0 8px rgba(61, 220, 132, 0.8); }
      .lamp.bad { background: #e5484d; box-shadow: 0 0 8px rgba(229, 72, 77, 0.7); }
      .chain { margin-left: auto; text-align: right; }
      .chain b { display: block; font-family: var(--f-mono); font-size: 13px; font-weight: 600; }
      .chain span { display: block; font-size: 11px; color: var(--ink-3); }

      h1 { font-size: 20px; margin: 22px 0 6px; letter-spacing: 0.02em; }
      .sub { font-size: 13px; color: var(--ink-2); line-height: 1.65; margin: 0 0 18px; }
      .sub code { font-family: var(--f-mono); font-size: 12px; color: var(--accent); word-break: break-all; }

      form.card { display: grid; gap: 12px; padding: 16px; border: 1px solid var(--hair); border-radius: 14px; background: var(--void-2); }
      label { font-size: 12px; color: var(--ink-3); display: grid; gap: 6px; }
      input { font-family: var(--f-mono); font-size: 15px; padding: 13px 12px; border-radius: 10px; border: 1px solid var(--hair); background: #0d1020; color: var(--ink); width: 100%; }
      input:focus { outline: 1px solid var(--accent); }
      #v-window { max-width: 140px; }
      .row2 { display: flex; gap: 14px; align-items: end; flex-wrap: wrap; }
      button { min-height: 52px; border: 0; border-radius: 12px; background: var(--accent); color: #14100a; font-size: 16px; font-weight: 700; letter-spacing: 0.06em; cursor: pointer; }
      button:disabled { opacity: 0.55; }
      .err { color: #ff8a8f; font-size: 13px; min-height: 1em; }
      .prog { color: var(--ink-3); font-size: 12px; font-family: var(--f-mono); min-height: 1em; }

      .summary { margin: 20px 0 8px; }
      .summary .head { font-size: 15px; margin: 0 0 6px; }
      .summary .bound { font-size: 12px; color: var(--ink-3); line-height: 1.7; margin: 0 0 6px; border-left: 2px solid var(--hair); padding-left: 10px; }
      .summary .hint { font-size: 12px; color: var(--accent); margin: 0 0 6px; }

      ul.claims { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; }
      li.claim { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 11px 12px; border: 1px solid var(--hair); border-radius: 12px; background: var(--void-2); font-family: var(--f-mono); font-size: 13px; }
      .sw { width: 14px; height: 14px; border-radius: 4px; flex: none; box-shadow: 0 0 6px rgba(255, 255, 255, 0.12); }
      .cell { font-weight: 700; }
      .pos, .fac, .meta { color: var(--ink-2); font-size: 12px; }
      .meta { color: var(--ink-3); }
      a.lnk { color: #7fb3ff; text-decoration: none; font-size: 12px; word-break: break-all; }
      a.lnk:hover, a.lnk:active { text-decoration: underline; }
      a.lnk.tx { margin-left: auto; }

      footer { margin-top: 30px; padding-top: 14px; border-top: 1px solid var(--hair); font-size: 12px; color: var(--ink-3); display: flex; gap: 16px; flex-wrap: wrap; }
      footer a { color: var(--ink-2); }
    </style>
  </head>
  <body>
    <div id="wrap">
      <header class="top">
        <span class="lamp" id="v-dot"></span>
        <span class="brand">MONAD BATTLEFIELD · VERIFY</span>
        <span class="chain"><b id="v-block">连接中…</b><span id="v-rpc"></span></span>
      </header>

      <h1>到场验证 · 链上归属查询</h1>
      <p class="sub">
        输入任何 EOA 地址，直接问链：这个地址在 Battlefield 合约
        <code>0xd525ef7ee4072e80765fd61633d80322040afd9d</code> 上抢下过哪些格子。<br />
        纯前端直连公共 RPC，无后端无密钥 —— 每一笔结果都可点开 MonadScan 核对。
      </p>

      <form class="card" id="v-form" autocomplete="off">
        <label>
          EOA 地址
          <input id="v-addr" placeholder="0x…" spellcheck="false" autocapitalize="off" inputmode="latin" />
        </label>
        <div class="row2">
          <label>
            扫描最近（块）
            <input id="v-window" value="2000" inputmode="numeric" />
          </label>
          <button id="v-go" type="submit">验 证</button>
        </div>
        <div class="err" id="v-err"></div>
        <div class="prog" id="v-progress"></div>
      </form>

      <div id="v-summary"></div>
      <div id="v-list"></div>

      <footer>
        <a href="/">← 主战场大屏</a>
        <a href="/join.html">参战页（手机点格）</a>
        <span>chainId 10143 · Monad Testnet</span>
      </footer>
    </div>
    <script type="module" src="/src/verify.ts"></script>
  </body>
</html>
